services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ipo_intelligence
      POSTGRES_USER: ipo
      POSTGRES_PASSWORD: ipo
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipo -d ipo_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ipo:ipo@postgres:5432/ipo_intelligence
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      TASK_EAGER: "false"
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_MODEL: ${LLM_MODEL:-llama-3.3-70b-versatile}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    ports: ["8000:8000"]
    volumes: [./data:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ipo:ipo@postgres:5432/ipo_intelligence
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/data/uploads
      TASK_EAGER: "false"
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
    command: celery -A app.workers.celery_app worker --loglevel=INFO
    volumes: [./data:/app/data]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  postgres_data:
